# o projeto
name: 'poc_dbt_lakehouse' # nome do projeto (usado no bloco models: também)
version: '1.0.0'  # versão do SEU projeto, livre
profile: 'poc_dbt_lakehouse'  # <<< a ponte: "use a conexão com esse nome no profiles.yml"

model-paths: ["models"] # onde o dbt procura os .sql de model
seed-paths: ["seeds"] # onde procura CSVs de seed
snapshot-paths: ["snapshots"] # etc — são só pastas
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets: ["target", "dbt_packages"] # o que o dbt vai limpar quando rodar o comando dbt clean

models:
  poc_dbt_lakehouse: # tem que ser o mesmo `name:` lá de cima
    staging: # = a pasta models/staging/
      +materialized: view  # todo model dessa pasta vira VIEW -- O + marca "isso é uma config, não uma subpasta".
    intermediate:
      +materialized: table #silver: idem, nada consome direto
    marts:
      +materialized: table #gold: o BI lê isso, tem que ser rápido